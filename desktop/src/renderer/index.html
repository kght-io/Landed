<!doctype html>
<meta charset="utf-8" />
<meta name="color-scheme" content="light dark" />
<title>Landed</title>
<style>
  /* Follows the system appearance rather than picking one. An app that is dark on a light-mode
     desktop reads as broken, and this window sits next to Finder and Mail, not inside the web app.
     Every colour is a light-dark() pair on one token, so there is no second palette to keep in sync
     and no [data-theme] selectors to forget. */
  :root {
    color-scheme: light dark;

    --bg:        light-dark(#ffffff, #09090b);
    --bg-sunken: light-dark(#f4f4f5, #18181b);
    --bg-raised: light-dark(#ffffff, #18181b);
    --bg-hover:  light-dark(#f4f4f5, #1f1f23);
    --bg-active: light-dark(#e4e4e7, #27272a);

    --text:      light-dark(#18181b, #e4e4e7);
    --text-dim:  light-dark(#52525b, #a1a1aa);
    --text-mute: light-dark(#a1a1aa, #52525b);

    --line:      light-dark(#e4e4e7, #27272a);
    --line-firm: light-dark(#d4d4d8, #3f3f46);

    --live:      light-dark(#16a34a, #22c55e);
    --error:     light-dark(#dc2626, #ef4444);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: grid; grid-template-rows: auto auto 1fr auto;
  }

  header { -webkit-app-region: drag; padding: 12px 16px 8px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header .spacer { flex: 1; }

  button { -webkit-app-region: no-drag; font: inherit; cursor: pointer;
    background: var(--bg-active); color: var(--text); border: 1px solid var(--line-firm);
    border-radius: 7px; padding: 4px 10px; }
  button:hover { background: var(--bg-hover); }
  button.ghost { background: transparent; border-color: transparent; color: var(--text-dim); padding: 4px 6px; }
  button.ghost:hover { color: var(--text); background: var(--bg-sunken); }

  .tabs { -webkit-app-region: no-drag; display: flex; gap: 2px; margin-left: 8px; }
  .tab { background: transparent; border: none; color: var(--text-dim); padding: 3px 10px; border-radius: 7px; }
  .tab:hover { color: var(--text); background: var(--bg-sunken); }
  .tab[aria-selected="true"] { background: var(--bg-active); color: var(--text); }

  nav { padding: 0 16px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    font-variant-numeric: tabular-nums; }
  nav .crumb { color: var(--text-dim); background: none; border: none; padding: 2px 4px; border-radius: 5px; }
  nav .crumb:hover { color: var(--text); background: var(--bg-sunken); }
  nav .sep { color: var(--text-mute); }

  main { overflow: auto; padding: 0 8px 8px; }
  ul { list-style: none; margin: 0; padding: 0 8px; }
  li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: default; }
  li:hover { background: var(--bg-sunken); }
  li .icon { width: 16px; text-align: center; color: var(--text-mute); flex: none; }
  li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .size { color: var(--text-mute); font-variant-numeric: tabular-nums; font-size: 12px; flex: none; }
  li .rev { opacity: 0; }
  li:hover .rev { opacity: 1; }
  li.dir { cursor: pointer; }
  .empty { color: var(--text-mute); padding: 24px 16px; text-align: center; }

  #agent { display: none; height: 100%; grid-template-rows: auto 1fr; }
  body.view-agent #list, body.view-agent nav { display: none; }
  body.view-agent #agent { display: grid; }
  body.view-files #agent { display: none; }

  .types { display: flex; gap: 6px; padding: 4px 16px 10px; flex-wrap: wrap; }
  .types button { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--bg-sunken);
    border: 1px solid var(--line); color: var(--text-dim); }
  .types button[aria-selected="true"] { background: var(--bg-active); color: var(--text); border-color: var(--line-firm); }
  .types button.live { border-color: var(--live); color: var(--live); }

  #log { margin: 0; padding: 0 16px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  #log:empty::after { content: "No output yet. The agent writes here while it drains.";
    color: var(--text-mute); font-size: 12px; padding-top: 12px; }

  .entry { font-size: 12.5px; line-height: 1.6; }
  .entry.assistant { color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .entry.note { color: var(--text-mute); font-size: 12px; }
  .entry.note.error { color: var(--error); }

  .tool-head { display: flex; align-items: baseline; gap: 7px; }
  .tool-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; align-self: center; }
  .tool-dot.ok { background: var(--live); }
  .tool-dot.bad { background: var(--error); }
  .tool-dot.pending { background: var(--text-mute); }
  .tool-name { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  .tool-args { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-mute);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-result { margin: 3px 0 0 13px; padding-left: 9px; border-left: 2px solid var(--line);
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-dim);
    white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow: auto; }

  .run-meta { margin-top: 4px; font-size: 11.5px; color: var(--text-mute);
    font-variant-numeric: tabular-nums; }

  footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
    color: var(--text-dim); font-size: 12px; }
  footer code { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-mute); flex: none; }
  .dot.live { background: var(--live); }
  .dot.error { background: var(--error); }
</style>

<header>
  <h1>Landed</h1>
  <span class="tabs">
    <button class="tab" data-view="agent">Agent</button>
    <button class="tab" data-view="files">Files</button>
  </span>
  <span class="spacer"></span>
  <button id="open-browser">Open Landed in browser →</button>
</header>

<nav id="crumbs"></nav>

<main>
  <ul id="list"></ul>

  <section id="agent">
    <div class="types" id="types"></div>
    <pre id="log"></pre>
  </section>
</main>

<footer>
  <span class="dot" id="dot"></span>
  <span id="status">…</span>
  <span class="spacer" style="flex:1"></span>
  <code id="root">…</code>
  <button class="ghost" id="reveal-root">Reveal</button>
</footer>

<script src="./app.js"></script>
